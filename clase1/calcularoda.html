<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: linear-gradient(90deg,#2196f3,#9c27b0,#ffeb3b);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .contenedor{
        width: 80%;
        background: rgba(0,0,0,0.6);
        border-radius: 10px;
        padding: 20px;
        color: white;
        box-shadow: 0px 0px 15px black;
    }

    h1{
        text-align: center;
        margin-bottom: 20px;
    }

    .fila{
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        padding-bottom: 15px;
    }

    .fila input{
        width: 60%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 18px;
    }

    .resultado{
        width: 80px;
        text-align: center;
        font-size: 40px;
        font-weight: bold;
    }

    .botones{
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 20px;
    }

    button{
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        color: white;
        transition: 0.3s;
    }

    button:hover{
        transform: scale(1.03);
    }

    .rosa{
        background: #ff5c8a;
    }

    .verde{
        background: #3fe0c5;
        grid-column: span 2;
    }

    #respuesta{
        margin-top: 20px;
        text-align: center;
        font-size: 35px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="contenedor">

    <h1>CALCULADORA</h1>

    <div class="fila">
        <div>
            <h2>NUMERO 1</h2>
            <input type="number" id="n1">
        </div>

        <div class="resultado" id="mostrar1">1</div>
    </div>

    <div class="fila">
        <div>
            <h2>NUMERO 2</h2>
            <input type="number" id="n2">
        </div>

        <div class="resultado" id="mostrar2">1</div>
    </div>

    <div class="botones">
        <button class="rosa" onclick="sumar()">SUMA</button>
        <button class="rosa" onclick="restar()">RESTA</button>
        <button class="rosa" onclick="multiplicar()">MULTIPLICACION</button>
        <button class="rosa" onclick="dividir()">DIVISION</button>
        <button class="verde" onclick="borrarTodo()">BORRAR</button>
    </div>

    <div id="respuesta">Resultado</div>

</div>

<script>

let n1 = document.getElementById("n1");
let n2 = document.getElementById("n2");

n1.addEventListener("input",()=>{
    document.getElementById("mostrar1").innerHTML = n1.value;
});

n2.addEventListener("input",()=>{
    document.getElementById("mostrar2").innerHTML = n2.value;
});

function sumar(){
    let r = Number(n1.value) + Number(n2.value);
    document.getElementById("respuesta").innerHTML = r;
}

function restar(){
    let r = Number(n1.value) - Number(n2.value);
    document.getElementById("respuesta").innerHTML = r;
}

function multiplicar(){
    let r = Number(n1.value) * Number(n2.value);
    document.getElementById("respuesta").innerHTML = r;
}

function dividir(){
    let r = Number(n1.value) / Number(n2.value);
    document.getElementById("respuesta").innerHTML = r;
}

function borrarTodo(){
    n1.value = "";
    n2.value = "";
    document.getElementById("mostrar1").innerHTML = "1";
    document.getElementById("mostrar2").innerHTML = "1";
    document.getElementById("respuesta").innerHTML = "Resultado";
}

</script>

</body>
</html>
